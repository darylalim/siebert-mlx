[project]
name = "siebert-mlx"
version = "0.7.0"
description = "Streamlit application for sentiment classification in English text using SiEBERT on Apple Silicon with MLX."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mlx",
    "mlx-transformers",
    "python-dotenv",
    "pandas",
    # Modern theming keys + st.container(horizontal=True) need >=1.58.0.
    "streamlit>=1.58.0,<2.0",
    "transformers",
    # Direct imports in _ensure_safetensors: the SiEBERT repo ships only
    # pytorch_model.bin, and mlx-transformers >=0.3.0 rejects .bin checkpoints
    # outright ("supports safetensors only") and no longer depends on torch, so
    # the one-time conversion has to bring its own.
    "torch",
    "safetensors",
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
