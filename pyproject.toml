[project]
name = "siebert-mlx"
version = "0.7.0"
description = "Streamlit application for sentiment classification in English text using SiEBERT on Apple Silicon with MLX."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mlx",
    "mlx-transformers",
    "python-dotenv",
    "pandas",
    # Modern theming keys + st.container(horizontal=True) need >=1.58.0.
    "streamlit>=1.58.0,<2.0",
    "transformers",
    # Both are imported directly by _ensure_safetensors, so both are declared
    # here regardless of who else pulls them in (safetensors still arrives via
    # mlx-transformers and transformers; torch no longer arrives at all, since
    # mlx-transformers 0.3.0 dropped it and now rejects .bin checkpoints
    # outright). torch is ~515 MB and exists purely for the one-time
    # pytorch_model.bin -> safetensors conversion, because the SiEBERT repo
    # ships no safetensors on `main`. Drop it if that ever changes upstream.
    "torch",
    "safetensors",
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: loads the real ~1.4 GB checkpoint; skipped unless `--integration` is passed",
]
# --strict-markers turns a typo'd marker into a collection error. Without it,
# `@pytest.mark.integraton` would not match conftest's skip hook and the test
# would run for real inside the offline Stop hook and CI `check` job.
addopts = "--strict-markers"
