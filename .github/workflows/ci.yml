name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple Silicon runner: `mlx` ships wheels only for macOS arm64, and both
    # pytest (imports streamlit_app -> mlx) and ty (resolves imports) need it.
    # macOS minutes are free on public repos.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # torch/safetensors (used by the model-conversion path and patched in
      # tests/conftest.py) are direct production deps, so a plain sync installs
      # them. --frozen fails CI if uv.lock is stale.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check .

      - name: Test
        run: uv run pytest -q

  integration:
    # The rest of the suite mocks model loading, so it cannot catch a silent
    # change in what the model computes -- which is exactly how the
    # mlx-transformers 0.3.0 float16 -> float32 encoder shift slipped through.
    # Split into its own job because it loads the real checkpoint; the fast
    # `check` job stays offline.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The checkpoint is public, so no HF_TOKEN is needed. Caching covers both
      # the ~1.4 GB pytorch_model.bin and the safetensors that
      # _ensure_safetensors writes beside it, so reruns skip the conversion
      # too. Bump the key suffix to force a re-download.
      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-siebert-${{ runner.os }}-v1

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Integration test
        run: uv run pytest -m integration -q
