name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the release job re-grants write to itself.
permissions:
  contents: read

jobs:
  check:
    # macos-latest because mlx ships wheels only for macOS arm64, and both pytest
    # (imports streamlit_app -> mlx) and ty (resolves imports) need it to resolve.
    # macOS minutes are free on public repos.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Explicit rather than the `auto` default, which disables the cache on
          # tag-push and release events -- this job should keep it if the trigger
          # set ever grows. The default cache-dependency-glob already keys on
          # pyproject.toml and uv.lock, so it is deliberately not overridden.
          enable-cache: true

      # --frozen fails CI if uv.lock is stale.
      - name: Sync dependencies
        run: uv sync --frozen

      # First because it is the cheapest gate and it validates the file that
      # governs every gate after it. Note the bootstrap limit: a YAML *syntax*
      # error here means GitHub never parses this workflow, so this step cannot
      # catch it -- which is why the Stop hook runs actionlint too, before the
      # file ever reaches GitHub. What it does catch is the class that matters
      # most now: shellcheck findings in the `run:` block of the release job,
      # the only code in this repo that executes with `contents: write`.
      - name: Workflow lint
        run: uv run actionlint

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check .

      - name: Test
        run: uv run pytest -q

  integration:
    # The rest of the suite mocks model loading, so it cannot catch a silent
    # change in what the model computes -- exactly how the mlx-transformers 0.3.0
    # float16 -> float32 encoder shift slipped through. Split out because it loads
    # the real checkpoint; `needs: check` so a lint/type/unit failure doesn't also
    # spend a 1.4 GB download to tell you the same thing.
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Covers the download *and* the safetensors conversion. The key is exact
      # and static, so actions/cache skips the save on a hit and this entry never
      # refreshes itself: if the model repo moves `main` to a new revision, every
      # run silently pays full download + conversion until someone bumps `-v1`.
      - name: Cache Hugging Face hub
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-siebert-${{ runner.os }}-v1

      - name: Sync dependencies
        run: uv sync --frozen

      # The checkpoint is public, so no token is required to be authorized.
      # HF_TOKEN is passed when the secret exists because anonymous downloads
      # from shared Actions IPs are the ones that get 429'd. Unset secret -> ""
      # -> load_model's `or None` keeps the request anonymous.
      - name: Integration test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest --integration -m integration -q

  release:
    # Publishes a GitHub Release as soon as a bumped `version` in pyproject.toml
    # lands green on main. `needs` both jobs above, so a release is never cut from
    # a commit CI has not verified. The ref is asserted here rather than inherited
    # from `on.push.branches`, so widening that trigger later cannot leak a public
    # release out of an unreviewed branch.
    needs: [check, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # ubuntu, not macos: this job reads pyproject.toml and calls the GitHub API,
    # never imports mlx, so it needs no arm64 wheels and no dependency sync.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Nothing is synced here, so a cache entry would only be dead weight.
          enable-cache: false

      # `gh release create --target` creates the tag itself and --generate-notes
      # builds the notes server-side, so a shallow checkout and no tag push are
      # enough. That tag is created with the GITHUB_TOKEN, and GitHub does not
      # start a workflow run from a GITHUB_TOKEN event -- so release.yml does NOT
      # also fire on it. That suppression is the only thing keeping the two
      # release paths from double-publishing; do not swap in a PAT without
      # removing one of them.
      - name: Publish release on version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v$(uv version --short)"

          # Keyed on the tag rather than the release, and by existence rather than
          # by diffing HEAD^. A diff misses a bump arriving behind a merge commit's
          # second parent and re-fires on a workflow re-run; asking what already
          # exists is correct for merge commits, squash merges and re-runs alike.
          # The tag specifically, because deleting a release to re-cut it by hand
          # leaves the tag behind, and that tag is the signal to stay out of the way.
          #
          # Assigned before the test, not piped into it: a transient API error then
          # aborts the job under `set -e` instead of reading as "no tag found" and
          # falling through to an unconditional create.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name')"
          if grep -qxF "$version" <<<"$tags"; then
            echo "$version is already tagged; nothing to do."
            exit 0
          fi

          # --target is the commit this run verified, which is not necessarily the
          # commit that bumped the version: if the bump's own run was superseded,
          # the release is cut from the newer tested tree rather than an untested one.
          #
          # Built as an array that is never empty, rather than appending a possibly
          # empty one: expanding "${arr[@]}" on an empty array under `set -u` is an
          # unbound-variable error before bash 4.4, and a publishing path should not
          # rest on the runner image's bash version.
          create=(gh release create "$version"
                  --title "$version"
                  --generate-notes
                  --target "$GITHUB_SHA")

          # PEP 440 pre-releases (0.8.0rc1, 1.0.0b2, 0.9.0.dev1) must not be able to
          # take the "Latest" slot on the releases page or in the README tag badge.
          if [[ "$version" =~ (a|b|rc)[0-9]+$|\.dev[0-9]+$ ]]; then
            create+=(--prerelease)
          fi

          echo "Publishing $version from $GITHUB_SHA"
          "${create[@]}"
