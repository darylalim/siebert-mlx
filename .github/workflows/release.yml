name: Release

# Manual escape hatch: publishes a GitHub Release when a version tag is pushed
# by hand, e.g. to re-cut a deleted release or tag an older commit.
#   git tag v0.8.0 && git push origin v0.8.0
#
# The normal path is ci.yml's `release` job, which publishes automatically when a
# bumped version in pyproject.toml lands green on main. The two cannot collide:
# that job's tag is created with the GITHUB_TOKEN, and GitHub does not start a
# workflow run from a GITHUB_TOKEN event, so this workflow never sees it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    # ubuntu (not macos like ci.yml): this job only calls the GitHub API via gh --
    # it never imports mlx or runs the suite -- so it needs no arm64 wheels.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to the job, matching ci.yml, so a step added later does not silently
    # inherit repository write access.
    permissions:
      contents: write
    steps:
      # Shallow is enough: --generate-notes builds the notes server-side and
      # --verify-tag checks the tag on the remote, so neither reads local history.
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Idempotent, so this path is safe to run twice on its own terms rather
          # than relying on ci.yml's tag never reaching it. Two ways it already
          # can fire on an existing release without any PAT involved:
          # force-pushing an existing tag, and re-running an old workflow run.
          #
          # Releases, not tags, because the tag necessarily exists here -- it is
          # what triggered this workflow. Assigned before the test rather than
          # piped into it, so a transient API error aborts under `set -e` instead
          # of reading as "not released" and falling through to create.
          releases="$(gh release list --limit 200 --json tagName --jq '.[].tagName')"
          if grep -qxF "$GITHUB_REF_NAME" <<<"$releases"; then
            echo "$GITHUB_REF_NAME is already released; nothing to do."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
